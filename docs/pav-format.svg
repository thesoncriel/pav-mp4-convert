<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" font-family="monospace" font-size="13">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="videoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="audioGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">PAV File Structure</text>

  <!-- Outer border -->
  <rect x="40" y="50" width="640" height="610" rx="8" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- HEADER section -->
  <rect x="40" y="50" width="640" height="100" rx="8" fill="url(#headerGrad)" stroke="#d97706" stroke-width="1.5"/>
  <rect x="40" y="50" width="640" height="100" rx="8" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="60" y="78" font-weight="bold" fill="#92400e" font-size="14">HEADER (8 bytes)</text>

  <rect x="60" y="90" width="290" height="40" rx="4" fill="#fff" fill-opacity="0.7" stroke="#d97706"/>
  <text x="70" y="115" fill="#78350f" font-size="12">[0x00-0x03] jpeg_data_size (uint32 LE)</text>

  <rect x="370" y="90" width="290" height="40" rx="4" fill="#fff" fill-opacity="0.7" stroke="#d97706"/>
  <text x="380" y="115" fill="#78350f" font-size="12">[0x04-0x07] audio_data_size (uint32 LE)</text>

  <!-- VIDEO section -->
  <rect x="40" y="150" width="640" height="280" fill="url(#videoGrad)" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="40" y="150" width="640" height="280" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="60" y="178" font-weight="bold" fill="#1e40af" font-size="14">VIDEO DATA (offset 0x08 ~ 0x08 + jpeg_data_size)</text>
  <text x="560" y="178" fill="#1e40af" font-size="11">220 x 176 px</text>

  <!-- Frame 0 -->
  <rect x="60" y="195" width="600" height="36" rx="4" fill="#fff" fill-opacity="0.7" stroke="#3b82f6"/>
  <text x="75" y="218" fill="#1e3a8a" font-size="12">JPEG Frame 0</text>
  <rect x="220" y="201" width="60" height="24" rx="3" fill="#93c5fd"/>
  <text x="232" y="218" fill="#1e3a8a" font-size="11">FF D8</text>
  <text x="290" y="218" fill="#64748b" font-size="11">... image data ...</text>
  <rect x="530" y="201" width="60" height="24" rx="3" fill="#93c5fd"/>
  <text x="542" y="218" fill="#1e3a8a" font-size="11">FF D9</text>
  <text x="605" y="218" fill="#64748b" font-size="10">(SOI/EOI)</text>

  <!-- Frame 1 -->
  <rect x="60" y="240" width="600" height="36" rx="4" fill="#fff" fill-opacity="0.7" stroke="#3b82f6"/>
  <text x="75" y="263" fill="#1e3a8a" font-size="12">JPEG Frame 1</text>
  <rect x="220" y="246" width="60" height="24" rx="3" fill="#93c5fd"/>
  <text x="232" y="263" fill="#1e3a8a" font-size="11">FF D8</text>
  <text x="290" y="263" fill="#64748b" font-size="11">... image data ...</text>
  <rect x="530" y="246" width="60" height="24" rx="3" fill="#93c5fd"/>
  <text x="542" y="263" fill="#1e3a8a" font-size="11">FF D9</text>

  <!-- Frame 2 -->
  <rect x="60" y="285" width="600" height="36" rx="4" fill="#fff" fill-opacity="0.7" stroke="#3b82f6"/>
  <text x="75" y="308" fill="#1e3a8a" font-size="12">JPEG Frame 2</text>
  <rect x="220" y="291" width="60" height="24" rx="3" fill="#93c5fd"/>
  <text x="232" y="308" fill="#1e3a8a" font-size="11">FF D8</text>
  <text x="290" y="308" fill="#64748b" font-size="11">... image data ...</text>
  <rect x="530" y="291" width="60" height="24" rx="3" fill="#93c5fd"/>
  <text x="542" y="308" fill="#1e3a8a" font-size="11">FF D9</text>

  <!-- Ellipsis -->
  <text x="360" y="345" text-anchor="middle" fill="#64748b" font-size="16">. . .</text>

  <!-- Frame N-1 -->
  <rect x="60" y="360" width="600" height="36" rx="4" fill="#fff" fill-opacity="0.7" stroke="#3b82f6"/>
  <text x="75" y="383" fill="#1e3a8a" font-size="12">JPEG Frame N-1</text>
  <rect x="220" y="366" width="60" height="24" rx="3" fill="#93c5fd"/>
  <text x="232" y="383" fill="#1e3a8a" font-size="11">FF D8</text>
  <text x="290" y="383" fill="#64748b" font-size="11">... image data ...</text>
  <rect x="530" y="366" width="60" height="24" rx="3" fill="#93c5fd"/>
  <text x="542" y="383" fill="#1e3a8a" font-size="11">FF D9</text>

  <!-- AUDIO section -->
  <rect x="40" y="430" width="640" height="230" fill="url(#audioGrad)" stroke="#059669" stroke-width="1.5"/>
  <rect x="40" y="430" width="640" height="230" fill="none" stroke="#374151" stroke-width="2"/>
  <text x="60" y="458" font-weight="bold" fill="#065f46" font-size="14">AUDIO DATA (offset 0x08 + jpeg_data_size ~ EOF)</text>

  <!-- RIFF header -->
  <rect x="60" y="470" width="600" height="36" rx="4" fill="#fff" fill-opacity="0.7" stroke="#10b981"/>
  <rect x="70" y="476" width="55" height="24" rx="3" fill="#6ee7b7"/>
  <text x="78" y="493" fill="#065f46" font-size="11">RIFF</text>
  <text x="135" y="493" fill="#065f46" font-size="11">chunk_size (u32)</text>
  <rect x="290" y="476" width="60" height="24" rx="3" fill="#6ee7b7"/>
  <text x="298" y="493" fill="#065f46" font-size="11">QLCM</text>
  <text x="370" y="493" fill="#64748b" font-size="11">RIFF Container Header (12 bytes)</text>

  <!-- fmt chunk -->
  <rect x="60" y="515" width="600" height="36" rx="4" fill="#fff" fill-opacity="0.7" stroke="#10b981"/>
  <rect x="70" y="521" width="55" height="24" rx="3" fill="#6ee7b7"/>
  <text x="78" y="538" fill="#065f46" font-size="11">fmt</text>
  <text x="135" y="538" fill="#065f46" font-size="11">150 bytes - codec: QCELP 13K</text>

  <!-- vrat chunk -->
  <rect x="60" y="560" width="600" height="36" rx="4" fill="#fff" fill-opacity="0.7" stroke="#10b981"/>
  <rect x="70" y="566" width="55" height="24" rx="3" fill="#6ee7b7"/>
  <text x="78" y="583" fill="#065f46" font-size="11">vrat</text>
  <text x="135" y="583" fill="#065f46" font-size="11">8 bytes - variable rate info</text>

  <!-- data chunk -->
  <rect x="60" y="605" width="600" height="36" rx="4" fill="#fff" fill-opacity="0.7" stroke="#10b981"/>
  <rect x="70" y="611" width="55" height="24" rx="3" fill="#6ee7b7"/>
  <text x="78" y="628" fill="#065f46" font-size="11">data</text>
  <text x="135" y="628" fill="#065f46" font-size="11">QCELP frames (35 bytes/frame, 20ms/frame)</text>

  <!-- FPS formula -->
  <text x="360" y="670" text-anchor="middle" fill="#374151" font-size="12" font-weight="bold">FPS = N (video frames) / (QCELP frame count x 0.02s)</text>
</svg>
