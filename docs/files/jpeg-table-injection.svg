<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="monospace" font-size="13">
  <defs>
    <linearGradient id="okGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="badGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <linearGradient id="fixGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">JPEG Table Injection (Frame Repair)</text>

  <!-- Frame 0: complete -->
  <text x="40" y="65" font-weight="bold" fill="#065f46" font-size="13">Frame 0 (complete)</text>
  <rect x="40" y="75" width="640" height="40" rx="6" fill="url(#okGrad)" stroke="#059669" stroke-width="1.5"/>
  <rect x="50" y="82" width="50" height="26" rx="3" fill="#6ee7b7" stroke="#059669"/>
  <text x="57" y="100" fill="#065f46" font-size="11">FFD8</text>
  <rect x="108" y="82" width="45" height="26" rx="3" fill="#fde68a" stroke="#d97706"/>
  <text x="115" y="100" fill="#78350f" font-size="10">APP7</text>
  <rect x="161" y="82" width="45" height="26" rx="3" fill="#c4b5fd" stroke="#7c3aed"/>
  <text x="170" y="100" fill="#5b21b6" font-size="10">DQT</text>
  <rect x="214" y="82" width="45" height="26" rx="3" fill="#c4b5fd" stroke="#7c3aed"/>
  <text x="223" y="100" fill="#5b21b6" font-size="10">DQT</text>
  <rect x="267" y="82" width="45" height="26" rx="3" fill="#fbcfe8" stroke="#db2777"/>
  <text x="274" y="100" fill="#9d174d" font-size="10">SOF0</text>
  <rect x="320" y="82" width="45" height="26" rx="3" fill="#c4b5fd" stroke="#7c3aed"/>
  <text x="329" y="100" fill="#5b21b6" font-size="10">DHT</text>
  <rect x="373" y="82" width="30" height="26" rx="3" fill="#c4b5fd" stroke="#7c3aed"/>
  <text x="377" y="100" fill="#5b21b6" font-size="8">...</text>
  <rect x="411" y="82" width="45" height="26" rx="3" fill="#fde68a" stroke="#d97706"/>
  <text x="418" y="100" fill="#78350f" font-size="10">APP8</text>
  <rect x="464" y="82" width="45" height="26" rx="3" fill="#93c5fd" stroke="#2563eb"/>
  <text x="473" y="100" fill="#1e3a8a" font-size="10">SOS</text>
  <rect x="517" y="82" width="110" height="26" rx="3" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="537" y="100" fill="#374151" font-size="10">scan data</text>
  <rect x="635" y="82" width="35" height="26" rx="3" fill="#6ee7b7" stroke="#059669"/>
  <text x="639" y="100" fill="#065f46" font-size="10">EOI</text>

  <!-- Extract arrow -->
  <path d="M 280 120 L 280 150" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4"/>
  <text x="290" y="140" fill="#7c3aed" font-size="11" font-weight="bold">tables 추출 (DQT + SOF0 + DHT)</text>

  <!-- Frame 1~N: broken -->
  <text x="40" y="185" font-weight="bold" fill="#991b1b" font-size="13">Frame 1~N (incomplete - tables 누락)</text>
  <rect x="40" y="195" width="640" height="40" rx="6" fill="url(#badGrad)" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="50" y="202" width="50" height="26" rx="3" fill="#fca5a5" stroke="#dc2626"/>
  <text x="57" y="220" fill="#991b1b" font-size="11">FFD8</text>
  <rect x="108" y="202" width="45" height="26" rx="3" fill="#fde68a" stroke="#d97706"/>
  <text x="115" y="220" fill="#78350f" font-size="10">APP8</text>
  <rect x="161" y="202" width="45" height="26" rx="3" fill="#93c5fd" stroke="#2563eb"/>
  <text x="170" y="220" fill="#1e3a8a" font-size="10">SOS</text>
  <rect x="214" y="202" width="410" height="26" rx="3" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="370" y="220" fill="#374151" font-size="10" text-anchor="middle">scan data (DQT/SOF0/DHT 없이 디코딩 불가)</text>
  <rect x="632" y="202" width="38" height="26" rx="3" fill="#fca5a5" stroke="#dc2626"/>
  <text x="638" y="220" fill="#991b1b" font-size="10">EOI</text>

  <!-- Arrow down -->
  <path d="M 360 240 L 360 275" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="375" y="262" fill="#2563eb" font-size="12" font-weight="bold">tables 주입</text>

  <!-- Frame 1~N: fixed -->
  <text x="40" y="300" font-weight="bold" fill="#1e40af" font-size="13">Frame 1~N (repaired - tables 주입 완료)</text>
  <rect x="40" y="310" width="640" height="40" rx="6" fill="url(#fixGrad)" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="50" y="317" width="50" height="26" rx="3" fill="#6ee7b7" stroke="#059669"/>
  <text x="57" y="335" fill="#065f46" font-size="11">FFD8</text>
  <rect x="108" y="317" width="45" height="26" rx="3" fill="#c4b5fd" stroke="#7c3aed"/>
  <text x="117" y="335" fill="#5b21b6" font-size="10">DQT</text>
  <rect x="161" y="317" width="45" height="26" rx="3" fill="#c4b5fd" stroke="#7c3aed"/>
  <text x="170" y="335" fill="#5b21b6" font-size="10">DQT</text>
  <rect x="214" y="317" width="45" height="26" rx="3" fill="#fbcfe8" stroke="#db2777"/>
  <text x="221" y="335" fill="#9d174d" font-size="10">SOF0</text>
  <rect x="267" y="317" width="45" height="26" rx="3" fill="#c4b5fd" stroke="#7c3aed"/>
  <text x="276" y="335" fill="#5b21b6" font-size="10">DHT</text>
  <rect x="320" y="317" width="30" height="26" rx="3" fill="#c4b5fd" stroke="#7c3aed"/>
  <text x="324" y="335" fill="#5b21b6" font-size="8">...</text>
  <rect x="358" y="317" width="45" height="26" rx="3" fill="#fde68a" stroke="#d97706"/>
  <text x="365" y="335" fill="#78350f" font-size="10">APP8</text>
  <rect x="411" y="317" width="45" height="26" rx="3" fill="#93c5fd" stroke="#2563eb"/>
  <text x="420" y="335" fill="#1e3a8a" font-size="10">SOS</text>
  <rect x="464" y="317" width="150" height="26" rx="3" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="505" y="335" fill="#374151" font-size="10" text-anchor="middle">scan data</text>
  <rect x="622" y="317" width="48" height="26" rx="3" fill="#6ee7b7" stroke="#059669"/>
  <text x="633" y="335" fill="#065f46" font-size="10">EOI</text>

  <!-- Legend -->
  <rect x="40" y="370" width="640" height="55" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="60" y="392" font-size="11" fill="#374151" font-weight="bold">Legend:</text>
  <rect x="120" y="380" width="30" height="16" rx="2" fill="#c4b5fd" stroke="#7c3aed"/>
  <text x="155" y="393" font-size="10" fill="#374151">Tables (DQT/DHT)</text>
  <rect x="270" y="380" width="30" height="16" rx="2" fill="#fbcfe8" stroke="#db2777"/>
  <text x="305" y="393" font-size="10" fill="#374151">SOF0 (dimensions)</text>
  <rect x="430" y="380" width="30" height="16" rx="2" fill="#93c5fd" stroke="#2563eb"/>
  <text x="465" y="393" font-size="10" fill="#374151">SOS (scan start)</text>
  <rect x="570" y="380" width="30" height="16" rx="2" fill="#fde68a" stroke="#d97706"/>
  <text x="605" y="393" font-size="10" fill="#374151">APP markers</text>
  <text x="60" y="414" font-size="10" fill="#6b7280">Frame 0의 DQT + SOF0 + DHT를 추출하여 Frame 1~N의 FFD8 뒤에 삽입 -> 모든 프레임이 독립적으로 디코딩 가능</text>
</svg>
